<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeaChat · AI 客服咨询系统</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-light: #273549;
      --brand: #38bdf8;
      --user: #2563eb;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e3a8a33, var(--bg) 55%);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: min(960px, 100%);
      padding: 22px 20px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 20px; margin: 0; }
    #llmState { margin-left: auto; font-size: 12px; color: var(--muted); }
    #llmState .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-right: 6px; }
    main {
      width: min(960px, 100%);
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 16px 20px;
      gap: 14px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 14px;
    }
    .toolbar label { font-size: 13px; color: var(--muted); }
    input[type="text"], textarea {
      background: var(--panel-light);
      border: 1px solid #334155;
      border-radius: 10px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--brand); }
    #phone { width: 170px; }
    .hint { font-size: 12px; color: var(--muted); }
    #chatBox {
      flex: 1;
      min-height: 420px;
      max-height: 62vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 8px 2px;
    }
    .msg { display: flex; gap: 10px; max-width: 86%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; background: var(--panel-light); color: var(--brand);
    }
    .msg.user .avatar { background: var(--user); color: #fff; }
    .bubble {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: var(--user); border-color: var(--user); }
    /* 模型输出为轻量 Markdown：渲染后统一走这里的小排版 */
    .text .md-h { font-weight: 700; color: #e2e8f0; margin: 10px 0 5px; }
    .text .md-h:first-child { margin-top: 0; }
    .text .md-p { margin: 0 0 6px; }
    .text ul { margin: 0 0 6px; padding-left: 18px; }
    .text li { margin-bottom: 3px; }
    .text strong { color: #f1f5f9; font-weight: 700; }
    .text code { background: rgba(148, 163, 184, .18); border-radius: 5px; padding: 1px 5px; font-size: 13px; }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tag { border: 1px solid #334155; border-radius: 999px; padding: 1px 8px; }
    .tag.intent-1 { color: #fbbf24; border-color: #fbbf2455; }
    .tag.intent-2 { color: #38bdf8; border-color: #38bdf855; }
    .tag.intent-0 { color: #94a3b8; }
    .tag.mode-llm { color: var(--ok); border-color: #22c55e55; }
    .tag.mode-rule { color: var(--warn); border-color: #f59e0b55; }
    .tools { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .tools summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--brand);
      border: 1px dashed #38bdf855;
      border-radius: 999px;
      padding: 1px 10px;
      list-style: none;
      user-select: none;
    }
    .tools summary::-webkit-details-marker { display: none; }
    .tools summary::before { content: "▸"; font-size: 10px; line-height: 1; }
    .tools[open] summary::before { content: "▾"; }
    .tools pre {
      white-space: pre-wrap;
      word-break: break-all;
      margin: 8px 0 0;
      padding: 8px 10px;
      background: var(--panel-light);
      border: 1px solid #334155;
      border-radius: 10px;
      color: var(--muted);
      font-family: inherit;
    }
    .composer {
      display: flex;
      gap: 10px;
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 10px;
      align-items: flex-end;
    }
    #query {
      flex: 1;
      min-height: 48px;
      max-height: 140px;
      resize: none;
    }
    button {
      background: var(--brand);
      color: #06202e;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: filter .15s;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .quick { display: flex; gap: 8px; flex-wrap: wrap; }
    .quick button {
      background: transparent;
      color: var(--muted);
      border: 1px dashed #334155;
      font-weight: 400;
      padding: 6px 12px;
      font-size: 12px;
    }
    footer { width: min(960px, 100%); padding: 0 20px 18px; color: #64748b; font-size: 12px; }
    .blink { animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <header>
    <h1>SeaChat · AI 客服咨询系统</h1>
    <span id="llmState"><span class="dot"></span>检测中…</span>
  </header>

  <main>
    <div class="toolbar">
      <label for="phone">咨询手机号</label>
      <input id="phone" type="text" placeholder="13800138000" maxlength="11" value="13800138000" />
      <span class="hint">请输入手机号，绑定后开始咨询</span>
    </div>

    <div id="chatBox"></div>

    <div class="quick">
      <button data-q="AI 职业规划怎么做？">AI 职业规划</button>
      <button data-q="Python 课程多少钱？">Python 课程价格</button>
      <button data-q="今天天气怎么样？">其他问题</button>
    </div>

    <div class="composer">
      <textarea id="query" placeholder="请输入您想咨询的问题（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </main>

  <!-- <footer>接口文档见 README.md：/chat、/vectorstore/*、/database/query、/health</footer> -->

  <script>
    const chatBox = document.getElementById("chatBox");
    const queryInput = document.getElementById("query");
    const sendBtn = document.getElementById("sendBtn");
    const phoneInput = document.getElementById("phone");
    const llmState = document.getElementById("llmState");
    let busy = false;

    const INTENT_NAMES = { 1: "AI 职业咨询", 2: "课程咨询", 0: "其他/常规咨询" };

    function escapeHtml(text) {
      return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // 行内样式：先整体转义再替换，避免模型输出被当成 HTML 执行
    function inlineMd(text) {
      return text
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    // 把模型输出的轻量 Markdown（标题 / 加粗 / 无序列表 / 行内代码）渲染成富文本。
    // 流式过程中仍按纯文本追加，收到 done 事件后一次性渲染，避免每帧重排。
    function formatRichText(raw) {
      const lines = escapeHtml(raw).split("\n");
      const out = [];
      let inList = false;
      const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };
      for (const line of lines) {
        const t = line.trim();
        if (!t) { closeList(); continue; }
        let m = t.match(/^#{1,6}\s+(.+)$/);
        if (m) { closeList(); out.push(`<div class="md-h">${inlineMd(m[1])}</div>`); continue; }
        m = t.match(/^[-*•]\s+(.+)$/);
        if (m) {
          if (!inList) { out.push("<ul>"); inList = true; }
          out.push(`<li>${inlineMd(m[1])}</li>`);
          continue;
        }
        closeList();
        out.push(`<div class="md-p">${inlineMd(t)}</div>`);
      }
      closeList();
      return out.join("");
    }

    function addMessage(role, content) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + (role === "user" ? "user" : "assistant");
      wrap.innerHTML = `
        <div class="avatar">${role === "user" ? "我" : "AI"}</div>
        <div class="bubble"><div class="text"></div><div class="extra"></div></div>`;
      wrap.querySelector(".text").textContent = content || "";
      chatBox.appendChild(wrap);
      chatBox.scrollTop = chatBox.scrollHeight;
      return wrap;
    }

    function appendDelta(msgEl, chunk) {
      const textEl = msgEl.querySelector(".text");
      textEl.textContent += chunk;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderMeta(msgEl, data) {
      const extra = msgEl.querySelector(".extra");
      const tags = [];
      if (data.intent_name) {
        tags.push(`<span class="tag intent-${data.intent_code}">意图 ${data.intent_code} · ${escapeHtml(data.intent_name)}</span>`);
      }
      if (data.mode) tags.push(`<span class="tag mode-${data.mode}">${data.mode === "llm" ? "模型回答" : data.mode === "welcome" ? "欢迎语" : "规则回答"}</span>`);
      if (data.user_info && data.user_info.phone_number) {
        const u = data.user_info;
        const parts = [u.name, u.intention_direction, u.stage, u.budget ? `预算 ${u.budget}` : null].filter(Boolean);
        if (parts.length) tags.push(`<span class="tag">画像：${escapeHtml(parts.join(" / "))}</span>`);
      }
      // 工具调用明细单独成块，不再塞进 flex 标签行，避免 summary 箭头与标签不齐
      let toolsHtml = "";
      if (data.tool_calls && data.tool_calls.length) {
        const list = data.tool_calls.map((t) => `• ${escapeHtml(t.name)}（${t.ok ? "成功" : "失败"}）`).join("\n");
        const okCount = data.tool_calls.filter((t) => t.ok).length;
        toolsHtml = `<details class="tools"><summary>工具调用 ${data.tool_calls.length} 次（成功 ${okCount} 次）</summary><pre>${list}</pre></details>`;
      }
      extra.innerHTML = `<div class="meta">${tags.join("")}</div>` + toolsHtml;
    }

    async function checkHealth() {
      try {
        const resp = await fetch("/health");
        const data = await resp.json();
        const available = data.llm && data.llm.available;
        llmState.innerHTML = `<span class="dot" style="background:${available ? "var(--ok)" : "var(--warn)"}"></span>` +
          (available ? `模型在线 · ${escapeHtml(data.llm.model || "")}` : "未配置 API Key · 离线规则模式");
      } catch (err) {
        llmState.innerHTML = `<span class="dot" style="background:#ef4444"></span>健康检查失败`;
      }
    }

    async function send() {
      const query = queryInput.value.trim();
      const phone = phoneInput.value.trim();
      if (!query || busy) return;
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        alert("请输入正确的 11 位手机号，例如 13800138000");
        return;
      }
      busy = true;
      sendBtn.disabled = true;
      queryInput.value = "";
      addMessage("user", query);
      const aiMsg = addMessage("assistant", "");
      const textEl = aiMsg.querySelector(".text");
      textEl.innerHTML = '<span class="blink">正在思考…</span>';
      let firstChunk = true;
      let fullText = "";

      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone_number: phone, query, stream: true }),
        });
        if (!resp.ok || !resp.body) {
          textEl.textContent = "请求失败，请稍后重试。";
          return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const frames = buffer.split("\n\n");
          buffer = frames.pop();
          for (const frame of frames) {
            const line = frame.trim();
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;
            let event;
            try { event = JSON.parse(payload); } catch (e) { continue; }
            if (event.type === "delta") {
              if (firstChunk) { textEl.textContent = ""; firstChunk = false; }
              fullText += event.content || "";
              appendDelta(aiMsg, event.content);
            } else if (event.type === "done") {
              textEl.innerHTML = formatRichText(fullText || event.reply || "");
              renderMeta(aiMsg, event);
            } else if (event.type === "error") {
              textEl.textContent = event.message || "处理失败";
            }
          }
        }
      } catch (err) {
        textEl.textContent = "网络异常，请确认服务已启动后重试。";
      } finally {
        busy = false;
        sendBtn.disabled = false;
        queryInput.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    queryInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
      }
    });
    document.querySelectorAll(".quick button").forEach((btn) => {
      btn.addEventListener("click", () => { queryInput.value = btn.dataset.q; queryInput.focus(); });
    });

    checkHealth();
    addMessage("assistant", "您好，我是 SeaChat 智能顾问，可以为您解答 AI 职业规划与课程相关的问题。请先确认手机号，然后开始咨询～");
  </script>
</body>
</html>
